<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFD400" />
    
    <!-- SEO Meta Tags -->
    <title>Clini.One - Sistema de Gestão Médica</title>
    <meta name="description" content="Sistema completo de gestão para clínicas médicas pequenas no Brasil. Reduza no-shows, organize prontuários e melhore a eficiência da sua clínica." />
    <meta name="keywords" content="clínica, gestão, agendamento, médico, saúde, consultório, prontuário eletrônico" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clini.One - Sistema de Gestão Médica" />
    <meta property="og:description" content="Sistema completo de gestão para clínicas médicas pequenas no Brasil" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Clini.One - Sistema de Gestão Médica" />
    <meta name="twitter:description" content="Sistema completo de gestão para clínicas médicas pequenas no Brasil" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Prevent FOUC -->
    <style>
      body { opacity: 0; }
      body.loaded { opacity: 1; transition: opacity 0.2s ease-in-out; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Prevent FOUC
      window.addEventListener('load', () => {
        document.body.classList.add('loaded');
      });
    </script>
  </body>
</html>
